apiVersion: v1
kind: PersistentVolume
metadata:
  name: kathleen-energy-pv-gpgnode12
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /sys/class/powercap/intel-rapl/
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - gpgnode-12
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kathleen-energy-pvc-gpgnode12
  namespace: default
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: local-storage
  resources:
    requests:
      storage: 1Gi
  volumeName: kathleen-energy-pv-gpgnode12

---
apiVersion: v1
kind: Pod
metadata:
  name: kathleen-pod-gpgnode12
  namespace: default
spec:
  nodeSelector:
    kubernetes.io/hostname: gpgnode-12
  containers:
    - name: kathleen-pod-gpgnode12
      image: ubuntu
      command: ["/bin/bash", "-c", "sleep infinity"]
      volumeMounts:
        - mountPath: /energy-data/gpgnode12
          name: energy-volume
          readOnly: true
        - mountPath: /private-data
          name: private-volume
  volumes:
    - name: energy-volume
      persistentVolumeClaim:
        claimName: kathleen-energy-pvc-gpgnode12
    - name: private-volume
      persistentVolumeClaim:
        claimName: ceph-pvc