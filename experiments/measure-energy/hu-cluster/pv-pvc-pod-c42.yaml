apiVersion: v1
kind: PersistentVolume
metadata:
  name: westkath-energy-pv-hu-worker-c42
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /sys/class/powercap/intel-rapl/
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - hu-worker-c42
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: westkath-energy-pvc-hu-worker-c42
  namespace: westkath
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: local-storage
  resources:
    requests:
      storage: 1Gi
  volumeName: westkath-energy-pv-hu-worker-c42

---
apiVersion: v1
kind: Pod
metadata:
  name: westkath-pod-c42
  namespace: westkath
spec:
  nodeSelector:
    kubernetes.io/hostname: hu-worker-c42
  containers:
    - name: westkath-pod-c42
      image: ubuntu
      command: ["/bin/bash", "-c", "sleep infinity"]
      volumeMounts:
        - mountPath: /energy-data/node-c42
          name: energy-volume
          readOnly: true
        - mountPath: /private-data
          name: private-volume
  volumes:
    - name: energy-volume
      persistentVolumeClaim:
        claimName: westkath-energy-pvc-hu-worker-c42
    - name: private-volume
      persistentVolumeClaim:
        claimName: ceph-experiments